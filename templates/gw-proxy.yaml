{{- if .Values.gwProxy.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gw-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: gw-proxy
data:
  "envoy.yaml": |
{{ include "envoy.config" . | indent 4}}
  "cds.yaml": |
{{ include "envoy.cds" . | indent 4}}
  "lds.yaml": |
{{ include "envoy.lds" . | indent 4}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gw-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    app: gw-proxy
    {{- if .Values.gwProxy.applicationLabels }}
    {{- .Values.gwProxy.applicationLabels | toYaml | nindent 4 }}
    {{- end }}
  {{- if .Values.gwProxy.applicationAnnotations }}
  annotations:
    {{- .Values.gwProxy.applicationAnnotations | toYaml | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.gwProxy.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: gw-proxy
  template:
    metadata:
      labels:
        app: gw-proxy
        {{- if .Values.gwProxy.podTemplateLabels }}
        {{- .Values.gwProxy.podTemplateLabels | toYaml | nindent 8 }}
        {{- end }}
      annotations:
        "cluster-autoscaler.kubernetes.io/safe-to-evict": "false"
        checksum/envoy: {{ printf "%s%s%s%s" (include "envoy.config" .) (include "envoy.cds" .) (include "envoy.lds" .) (toJson .Values.ssl) | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/stats/prometheus"
        {{- if .Values.gwProxy.podTemplateAnnotations }}
        {{- .Values.gwProxy.podTemplateAnnotations | toYaml | nindent 8 }}
        {{- end }}
    spec:
      {{- include "opthub.podSecurityContext" (dict "name" "gwProxy" "component" .Values.gwProxy "default" "opthub.podSecurityContext.gwProxy.default") | nindent 6 }}
      {{- with .Values.secrets.imagePull }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gwProxy.initContainers }}
      initContainers: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gw-proxy
          {{- $image := .Values.gwProxy.image | default dict }}
          image: {{ if $image.repository }}{{ $image.repository }}{{ else }}{{ with .Values.registry.dockerhubMirror }}{{ trimSuffix "/" . }}/{{ end }}envoyproxy/envoy{{ end }}:{{ $image.tag | default "distroless-v1.40-latest" }}
          imagePullPolicy: {{ $image.pullPolicy | default "Always" }}
          {{- include "opthub.containerSecurityContext" (dict "name" "gwProxy" "component" .Values.gwProxy) | nindent 10 }}
          {{- if .Values.gwProxy.command }}
          command: {{- .Values.gwProxy.command | toYaml | nindent 10 }}
          {{- end }}
          {{- with .Values.gwProxy.extraEnv }}
          env: {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - "-c /etc/envoy/envoy.yaml"
            - "-l warn"
          ports:
            - name: admin
              containerPort: 8000
            - name: svc
              containerPort: 8001
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: {{ .Values.gwProxy.ports.serviceGrpcPort }}
              {{- if .Values.grafana.enabled }}
            - name: grafana
              containerPort: 3000
              {{- end }}
          livenessProbe:
            httpGet:
              path: /server_info
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: "/etc/envoy"
              readOnly: true
{{- if .Values.ssl.enabled }}
            - mountPath: "/opt/ssl"
              name: ssl-cert
              readOnly: true
{{- end }}
{{- with .Values.gwProxy.extraVolumeMounts }}
{{- toYaml . | nindent 12 }}
{{- end }}
{{- if .Values.gwProxy.resources }}
          resources: {{- .Values.gwProxy.resources | toYaml | nindent 12 }}
{{- end }}
      volumes:
        - name: config
          configMap:
            name: gw-proxy
{{- if .Values.ssl.enabled }}
        - name: ssl-cert
          secret:
            secretName: {{ include "ssl.secretName" . }}
{{- end }}
{{- with .Values.gwProxy.extraVolumes }}
{{- toYaml . | nindent 8 }}
{{- end }}
{{- if .Values.gwProxy.nodeSelector }}
      nodeSelector: {{- .Values.gwProxy.nodeSelector | toYaml | nindent 8 }}
{{- end }}
{{- if .Values.gwProxy.tolerations }}
      tolerations: {{- .Values.gwProxy.tolerations | toYaml | nindent 8 }}
{{- end }}
{{- if .Values.gwProxy.affinity }}
      affinity: {{- .Values.gwProxy.affinity | toYaml | nindent 8 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
    {{- if .Values.gwProxy.serviceLabels }}
    {{- .Values.gwProxy.serviceLabels | toYaml | nindent 4 }}
    {{- end }}
spec:
  clusterIP: None
  ports:
{{- if .Values.gateway.service.httpEndpoint.enabled }}
    - port: {{ .Values.gateway.service.httpEndpoint.port }}
      protocol: TCP
      name: http
      targetPort: 8080
{{- end }}
    - port: {{ .Values.gateway.service.grpc.port }}
      protocol: TCP
      name: grpc
      targetPort: {{ .Values.gateway.ports.serviceGrpcPort }}
  selector:
    app: gateway
{{- if and ((.Values.logStore).enabled) (eq ((.Values.logStore).deploymentMode) "dedicatedService")  }}
---
apiVersion: v1
kind: Service
metadata:
  name: log-store-headless
  namespace: {{ .Release.Namespace }}
  labels:
    app: log-store
spec:
  clusterIP: None
  ports:
    - port: 50051
      protocol: TCP
      name: grpc
      targetPort: 50051
  selector:
    app: log-store
{{- end }}
{{- end }}
