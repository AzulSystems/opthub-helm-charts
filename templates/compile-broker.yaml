{{- if and (eq "" .Values.deployment.serviceAccount.existingServiceAccount) (eq "" .Values.compileBroker.existingServiceAccount)}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "compileBroker.serviceAccount" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.deployment.serviceAccount.labels }}
  labels:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.deployment.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
{{- if and .Values.compileBroker .Values.compileBroker.enabled}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compile-broker
  namespace: {{ .Release.Namespace }}
  labels:
    app: compile-broker
    {{- if .Values.compileBroker.applicationLabels }}
    {{- .Values.compileBroker.applicationLabels | toYaml | nindent 4 }}
    {{- end }}
  {{- if .Values.compileBroker.applicationAnnotations }}
  annotations:
    {{- .Values.compileBroker.applicationAnnotations | toYaml | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.compileBroker.replicas | default 1 }}
  selector:
    matchLabels:
      app: compile-broker
  template:
    metadata:
      labels:
        app: compile-broker
        {{- if .Values.compileBroker.podTemplateLabels }}
        {{- .Values.compileBroker.podTemplateLabels | toYaml | nindent 8 }}
        {{- end }}
      annotations:
        "cluster-autoscaler.kubernetes.io/safe-to-evict": "false"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/q/metrics"
        checksum/opthub.properties: {{ (include "opthub.properties.content" .) | sha256sum }}
        {{- if .Values.compileBroker.podTemplateAnnotations }}
        {{- .Values.compileBroker.podTemplateAnnotations | toYaml | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.compileBroker.spec }}
      {{- .Values.compileBroker.spec | toYaml | nindent 6 }}
      {{- end }}
      {{- include "opthub.podSecurityContext" (dict "name" "compileBroker" "component" .Values.compileBroker "default" "opthub.podSecurityContext.default") | nindent 6 }}
      {{- with .Values.secrets.imagePull }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.compileBroker.initContainers }}
      initContainers: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: compile-broker
        image: {{ .Values.registry.opthub }}/opthub-compile-broker:{{ default .Chart.AppVersion .Values.appVersionOverride }}{{ default .Values.versionSuffix .Values.compileBroker.versionSuffix }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        {{- include "opthub.containerSecurityContext" (dict "name" "compileBroker" "component" .Values.compileBroker) | nindent 8 }}
        {{- if .Values.compileBroker.command }}
        command: {{- .Values.compileBroker.command | toYaml | nindent 8 }}
        {{- end }}
        env:
{{- with include "blobStorage.envvars" . | trim }}{{- . | nindent 10 }}{{- end }}
{{- with .Values.compileBroker.extraEnv }}{{- toYaml . | nindent 10 }}{{- end }}
        args:
        {{- include "opthub.container.args" . | nindent 8 }}
        - "-XX:+ExitOnOutOfMemoryError"
        - "-XX:MaxRAMPercentage=60"
        - "-XX:-OmitStackTraceInFastThrow"
{{- if .Values.compileBroker.extraArguments }}
        {{- .Values.compileBroker.extraArguments | toYaml | nindent 8 }}
{{- end }}
{{- if .Values.compileBroker.extraArgumentsMap }}
    {{- range $key, $val := .Values.compileBroker.extraArgumentsMap }}
        - -D{{ $key }}={{ $val }}
    {{- end }}
{{- end }}
        ports:
        - containerPort: 8080
          name: http-endpoint
        {{- if .Values.compileBroker.resources }}
        resources: {{- .Values.compileBroker.resources | toYaml | nindent 10 }}
        {{- end }}
        {{- if ne true .Values.compileBroker.disableKubernetesProbes }}
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: http-endpoint
          initialDelaySeconds: 0
          timeoutSeconds: 1
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: http-endpoint
          initialDelaySeconds: 0
          timeoutSeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /q/health/started
            port: http-endpoint
          initialDelaySeconds: 0
          timeoutSeconds: 1
          periodSeconds: 5
          failureThreshold: 18
        {{- end }}
        volumeMounts:
          - name: config
            mountPath: "/etc/opthub"
            readOnly: true
          - name: tmp-volume
            mountPath: /tmp
{{- with .Values.compileBroker.extraVolumeMounts }}
{{- toYaml . | nindent 10 }}
{{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "quarkus-config.name" . }}
            items:
              - key: "opthub.properties"
                path: "opthub.properties"
        - name: tmp-volume
          emptyDir:
{{- if (((.Values.compileBroker).resources).limits) }}
            sizeLimit: {{ get .Values.compileBroker.resources.limits "ephemeral-storage" }}
{{- end }}
{{- with .Values.compileBroker.extraVolumes }}
{{- toYaml . | nindent 8 }}
{{- end }}
      terminationGracePeriodSeconds: {{ .Values.compileBroker.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "compileBroker.serviceAccount" . }}
{{- if .Values.compileBroker.nodeSelector }}
      nodeSelector: {{- .Values.compileBroker.nodeSelector | toYaml | nindent 8 }}
{{- end }}
{{- if .Values.compileBroker.tolerations }}
      tolerations: {{- .Values.compileBroker.tolerations | toYaml | nindent 8 }}
{{- end }}
{{- if .Values.compileBroker.affinity }}
      affinity: {{- .Values.compileBroker.affinity | toYaml | nindent 8 }}
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: compile-broker
  namespace: {{ .Release.Namespace }}
  labels:
    app: compile-broker
    {{- if .Values.compileBroker.serviceLabels }}
    {{- .Values.compileBroker.serviceLabels | toYaml | nindent 4 }}
    {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: 50051
      protocol: TCP
      name: grpc-server
  selector:
    app: compile-broker
{{- end }}
