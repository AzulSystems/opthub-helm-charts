{{- include "validateRequiredValues" . }}

{{- if ((.Values.taskExecutor).enabled) }}

{{- if and (eq "" .Values.deployment.serviceAccount.existingServiceAccount) (eq "" .Values.taskExecutor.existingServiceAccount)}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "taskExecutor.serviceAccount" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.deployment.serviceAccount.labels }}
  labels:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.deployment.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-executor
  namespace: {{ .Release.Namespace }}
  labels:
    app: task-executor
    {{- if .Values.taskExecutor.applicationLabels }}
    {{- .Values.taskExecutor.applicationLabels | toYaml | nindent 4 }}
    {{- end }}
  {{- if .Values.taskExecutor.applicationAnnotations }}
  annotations:
    {{- .Values.taskExecutor.applicationAnnotations | toYaml | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-executor
  template:
    metadata:
      labels:
        app: task-executor
        {{- if .Values.taskExecutor.podTemplateLabels }}
        {{- .Values.taskExecutor.podTemplateLabels | toYaml | nindent 8 }}
        {{- end }}
      annotations:
        "cluster-autoscaler.kubernetes.io/safe-to-evict": "false"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/q/metrics"
        checksum/opthub.properties: {{ (include "opthub.properties.content" .) | sha256sum }}
        {{- if .Values.taskExecutor.podTemplateAnnotations }}
        {{- .Values.taskExecutor.podTemplateAnnotations | toYaml | nindent 8 }}
        {{- end }}
    spec:
      {{- include "opthub.podSecurityContext" (dict "name" "taskExecutor" "component" .Values.taskExecutor "default" "opthub.podSecurityContext.default") | nindent 6 }}
      {{- if .Values.taskExecutor.spec }}
      {{- .Values.taskExecutor.spec | toYaml | nindent 6 }}
      {{- end }}
      {{- with .Values.secrets.imagePull }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.taskExecutor.initContainers }}
      initContainers: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: task-executor
          image: {{ .Values.registry.opthub }}/opthub-task-executor:{{ default .Chart.AppVersion .Values.appVersionOverride }}{{ default .Values.versionSuffix .Values.taskExecutor.versionSuffix }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- include "opthub.containerSecurityContext" (dict "name" "taskExecutor" "component" .Values.taskExecutor) | nindent 10 }}
          {{- if .Values.taskExecutor.command }}
          command: {{- .Values.taskExecutor.command | toYaml | nindent 10 }}
          {{- end }}
          env:
{{- with include "blobStorage.envvars" . | trim }}{{- . | nindent 12 }}{{- end }}
{{- with .Values.taskExecutor.extraEnv }}{{- toYaml . | nindent 12 }}{{- end }}
          args:
            {{- include "opthub.container.args" . | nindent 12 }}
            - "-XX:+ExitOnOutOfMemoryError"
            - "-XX:MaxRAMPercentage=60"
            - "-XX:-OmitStackTraceInFastThrow"
{{- if .Values.taskExecutor.extraArguments }}
        {{- .Values.taskExecutor.extraArguments | toYaml | nindent 12 }}
{{- end }}
{{- if .Values.taskExecutor.extraArgumentsMap }}
    {{- range $key, $val := .Values.taskExecutor.extraArgumentsMap }}
            - -D{{ $key }}={{ $val }}
    {{- end }}
{{- end }}
          ports:
            - containerPort: 8080
              name: http-endpoint
{{- if .Values.taskExecutor.resources }}
          resources: {{- .Values.taskExecutor.resources | toYaml | nindent 12 }}
{{- end }}
{{- if ne true .Values.taskExecutor.disableKubernetesProbes }}
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http-endpoint
            initialDelaySeconds: 0
            timeoutSeconds: 1
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http-endpoint
            initialDelaySeconds: 0
            timeoutSeconds: 1
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http-endpoint
            initialDelaySeconds: 0
            timeoutSeconds: 1
            periodSeconds: 5
            failureThreshold: 18
{{- end }}
          volumeMounts:
            - name: config
              mountPath: "/etc/opthub"
              readOnly: true
            - name: tmp-volume
              mountPath: /tmp
{{- with .Values.taskExecutor.extraVolumeMounts }}
{{- toYaml . | nindent 12 }}
{{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "quarkus-config.name" . }}
            items:
              - key: "opthub.properties"
                path: "opthub.properties"
        - name: tmp-volume
          emptyDir:
{{- if (((.Values.taskExecutor).resources).limits) }}
            sizeLimit: {{ get .Values.taskExecutor.resources.limits "ephemeral-storage" }}
{{- end }}
{{- with .Values.taskExecutor.extraVolumes }}
{{- toYaml . | nindent 8 }}
{{- end }}
      terminationGracePeriodSeconds: {{ .Values.taskExecutor.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "taskExecutor.serviceAccount" . }}
{{- if .Values.taskExecutor.nodeSelector }}
      nodeSelector: {{- .Values.taskExecutor.nodeSelector | toYaml | nindent 8 }}
{{- end }}
{{- if .Values.taskExecutor.tolerations }}
      tolerations: {{- .Values.taskExecutor.tolerations | toYaml | nindent 8 }}
{{- end }}
{{- if .Values.taskExecutor.affinity }}
      affinity: {{- .Values.taskExecutor.affinity | toYaml | nindent 8 }}
{{- end }}

{{- end}}
