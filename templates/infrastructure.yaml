{{- include "validateRequiredValues" . }}

{{- if and (eq "" .Values.deployment.serviceAccount.existingServiceAccount) (eq "" .Values.gateway.existingServiceAccount)}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gateway.serviceAccount" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.deployment.serviceAccount.labels }}
  labels:
  {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.deployment.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
    {{- if .Values.gateway.applicationLabels }}
    {{- .Values.gateway.applicationLabels | toYaml | nindent 4 }}
    {{- end }}
  {{- if .Values.gateway.applicationAnnotations }}
  annotations:
    {{- .Values.gateway.applicationAnnotations | toYaml | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.gateway.replicas | default 1 }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        {{- if .Values.gateway.podTemplateLabels }}
        {{- .Values.gateway.podTemplateLabels | toYaml | nindent 8 }}
        {{- end }}
      annotations:
        "cluster-autoscaler.kubernetes.io/safe-to-evict": "false"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/q/metrics"
        checksum/opthub.properties: {{ (include "opthub.properties.content" .) | sha256sum }}
        {{- if .Values.gateway.podTemplateAnnotations }}
        {{- .Values.gateway.podTemplateAnnotations | toYaml | nindent 8 }}
        {{- end }}
    spec:
      {{- include "opthub.podSecurityContext" (dict "name" "gateway" "component" .Values.gateway "default" "opthub.podSecurityContext.default") | nindent 6 }}
      {{- if .Values.gateway.spec }}
      {{- .Values.gateway.spec | toYaml | nindent 6 }}
      {{- end }}
      {{- with .Values.secrets.imagePull }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.initContainers }}
      initContainers: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: gateway
        image: {{ .Values.registry.opthub }}/opthub-gateway:{{ default .Chart.AppVersion .Values.appVersionOverride }}{{ default .Values.versionSuffix .Values.gateway.versionSuffix }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        {{- include "opthub.containerSecurityContext" (dict "name" "gateway" "component" .Values.gateway) | nindent 8 }}
        {{- if .Values.gateway.command }}
        command: {{- .Values.gateway.command | toYaml | nindent 8 }}
        {{- end }}
        env:
{{- with include "blobStorage.envvars" . | trim }}{{- . | nindent 10 }}{{- end }}
{{- with .Values.gateway.extraEnv }}{{- toYaml . | nindent 10 }}{{- end }}
        args:
        {{- include "opthub.container.args" . | nindent 8 }}
        - "-XX:+ExitOnOutOfMemoryError"
        - "-XX:MaxRAMPercentage=60"
        - "-XX:-OmitStackTraceInFastThrow"
{{- if .Values.gateway.extraArguments }}
        {{- .Values.gateway.extraArguments | toYaml | nindent 8 }}
{{- end }}
{{- if .Values.gateway.extraArgumentsMap }}
    {{- range $key, $val := .Values.gateway.extraArgumentsMap }}
        - -D{{ $key }}={{ $val }}
    {{- end }}
{{- end }}
        ports:
        - containerPort: 8080
          name: http-endpoint
{{- if .Values.gateway.resources }}
        resources: {{- .Values.gateway.resources | toYaml | nindent 10 }}
{{- end }}
        {{- if ne true .Values.gateway.disableKubernetesProbes }}
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: http-endpoint
          initialDelaySeconds: 0
          timeoutSeconds: 1
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: http-endpoint
          initialDelaySeconds: 0
          timeoutSeconds: 1
          periodSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /q/health/started
            port: http-endpoint
          initialDelaySeconds: 0
          timeoutSeconds: 1
          periodSeconds: 5
          failureThreshold: 18
        {{- end }}
        volumeMounts:
          - name: config
            mountPath: "/etc/opthub"
            readOnly: true
          - name: tmp-volume
            mountPath: /tmp
{{- with .Values.gateway.extraVolumeMounts }}
{{- toYaml . | nindent 10 }}
{{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "quarkus-config.name" . }}
            items:
              - key: "opthub.properties"
                path: "opthub.properties"
        - name: tmp-volume
          emptyDir:
{{- if (((.Values.gateway).resources).limits) }}
            sizeLimit: {{ get .Values.gateway.resources.limits "ephemeral-storage" }}
{{- end }}
{{- with .Values.gateway.extraVolumes }}
{{- toYaml . | nindent 8 }}
{{- end }}
      serviceAccountName: {{ include "gateway.serviceAccount" . }}
{{- if .Values.gateway.nodeSelector }}
      nodeSelector: {{- .Values.gateway.nodeSelector | toYaml | nindent 8 }}
{{- end }}
{{- if .Values.gateway.tolerations }}
      tolerations: {{- .Values.gateway.tolerations | toYaml | nindent 8 }}
{{- end }}
{{- if .Values.gateway.affinity }}
      affinity: {{- .Values.gateway.affinity | toYaml | nindent 8 }}
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
    {{- if .Values.gateway.serviceLabels }}
    {{- .Values.gateway.serviceLabels | toYaml | nindent 4 }}
    {{- end }}
{{- if .Values.gateway.service.annotations }}
  annotations: {{- .Values.gateway.service.annotations | toYaml | nindent 4 }}
{{- end }}
spec:
  ports:
{{- if .Values.gateway.service.httpEndpoint.enabled }}
    - port: {{ .Values.gateway.service.httpEndpoint.port }}
      protocol: TCP
      name: http-server
{{- if not .Values.gwProxy.enabled }}
      appProtocol: http2
{{- end }}
      targetPort: 8080
{{- end }}
    - name: grpc-server
      protocol: TCP
      appProtocol: grpc
      port: {{ .Values.gateway.service.grpc.port }}
{{- if  .Values.gwProxy.enabled }}
      targetPort: {{ .Values.gwProxy.ports.serviceGrpcPort }}
{{- else }}
      targetPort: {{ .Values.gateway.ports.serviceGrpcPort }}
{{- end }}
{{- if  .Values.gwProxy.enabled }}
  selector:
    app: gw-proxy
{{- else }}
  selector:
    app: gateway
{{- end }}
  type: {{ .Values.gateway.service.type | default (ternary "LoadBalancer" "NodePort" .Values.gwProxy.enabled) }}
