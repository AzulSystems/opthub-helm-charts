apiVersion: batch/v1
kind: Job
metadata:
  name: blobstorage-setup-job
  namespace: blobstorage-dev  # Change this value to match the namespace metadata.name
spec:
  template:
    spec:
      containers:
        - name: blobstorage-setup
          image: docker-mirror.azulsystems.com/amazon/aws-cli:2.37.12
          env:
            - name: AWS_ACCESS_KEY_ID
              value: "blobstorage"
            - name: AWS_SECRET_ACCESS_KEY
              value: "blobstorage123"
            - name: AWS_DEFAULT_REGION
              value: "us-west-2"
            - name: BUCKET_NAME
              value: "opthub"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: ["sh", "-c"]
          args:
            - |
              aws --endpoint-url http://blobstorage:9000 s3api head-bucket --bucket "$BUCKET_NAME" ||
              aws --endpoint-url http://blobstorage:9000 s3api create-bucket --bucket "$BUCKET_NAME"
      restartPolicy: OnFailure
