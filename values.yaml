  #      secretName: my-certs
  # Additional volumeMounts for the main container (standard Kubernetes volumeMount spec), appended after the chart-defined ones.
  # Needed to mount extraVolumes into the application container. Unset by default.
  #extraVolumeMounts:
  #  - name: custom-certs
  #    mountPath: /etc/custom-certs
  #    readOnly: true

# Monitoring section
grafana:
  enabled: false
  # Default admin password: the same `admin` that a new Grafana starts with. Grafana asks to set
  # a new password at the first login. SET YOUR OWN PASSWORD before exposing Grafana, either here
  # or with `admin.existingSecret`. Without any password the Grafana subchart generates a random
  # one on every render, so `helm template` output is not stable.
  # - If the login form is disabled (`grafana.ini` auth.disable_login_form), the password prompt
  #   cannot be reached and `admin` stays valid, so change the password here in that case.
  # - Grafana reads this password only when it creates its database. With `grafana.persistence`
  #   enabled, changing it later (or upgrading an install that had the generated one) does not
  #   change the live password, and the Secret then no longer matches it.
  adminPassword: admin

prometheus:
  enabled: false

##########################################################################################
# Pod-level and container-level securityContext
#
# Configurable per component for: gateway, mgmtGateway, compileBroker, cache, operator,
# taskExecutor, logStore and gwProxy, with two independent keys:
#   <component>.podSecurityContext        -> the PodSpec `securityContext`
#   <component>.containerSecurityContext  -> the `securityContext` of the component container
# For example `mgmtGateway.podSecurityContext`.
#
# The keys are intentionally not declared in this file. The defaults are built into the
# templates and are rendered when a key is not set:
#   pod, all components but gwProxy: runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001,
#                                    fsGroup: 10001
#   pod, gwProxy:                    runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532,
#                                    fsGroup: 65532
#   container, all components:       readOnlyRootFilesystem: true, allowPrivilegeEscalation: false,
#                                    capabilities.drop: [ALL]
#
# Semantics:
#  - Key absent (or null): the defaults above are rendered unchanged.
#  - Non-empty map: REPLACES the defaults as a whole, there is no field-level merge. Any valid
#    Kubernetes securityContext field is accepted; list every field you want to keep.
#  - Empty map {}: removes the defaults, `securityContext: {}` is rendered.
#  - A value that is not a map fails the render.
#  - The pod-level and container-level keys are independent: setting one does not affect the
#    defaults of the other.
#  - <component>.spec.securityContext is rejected, because it would render a second
#    `securityContext` key; use <component>.podSecurityContext instead. Other <component>.spec
#    fields are passed through as before, see "Container arguments, probes and raw pod
#    spec" below. gwProxy has no <component>.spec passthrough.
#  - Several -f files: override maps from different files are deep-merged with each other
#    (standard Helm behavior), and the merged map then replaces the defaults. `{}` in a later
#    file does not clear a non-empty map from an earlier file. A null field at the top level of
#    the map in a later file removes that field from the merged map. Nulls in nested maps (for
#    example `capabilities.add: null`) are rendered as they are.
#
# Example: no pod-level securityContext, custom container-level securityContext.
#   mgmtGateway:
#     podSecurityContext: {}
#     containerSecurityContext:
#       allowPrivilegeEscalation: false
#       readOnlyRootFilesystem: true
#       capabilities:
#         drop: [ALL]
##########################################################################################

##########################################################################################
# Extra volumes and volume mounts
#
# Adds user-defined volumes to the pods of Optimizer Hub workloads and mounts them into the
# main application container, with two independent keys:
#   <component>.extraVolumes       -> entries appended to the PodSpec `volumes`, after the
#                                     chart-defined volumes
#   <component>.extraVolumeMounts  -> entries appended to the `volumeMounts` of the main
#                                     container, after the chart-defined volume mounts
# For example `gateway.extraVolumes`.
#
# Both keys take standard Kubernetes `volume` and `volumeMount` entries, which are rendered as
# given. They are unset by default; when unset, the rendered manifests are unchanged.
#
# extraVolumeMounts is a technical companion of extraVolumes, not a separate feature. A volume
# that is not mounted is usable only by init containers, so mounting it into the application
# container needs its own key. You can set extraVolumes alone, for example to share a volume
# with `initContainers` only. Init containers declare their own `volumeMounts` in
# `initContainers`; extraVolumeMounts applies to the main container only.
#
# Applicable workloads: gateway, gwProxy, operator, taskExecutor, mgmtGateway, compileBroker,
# cache and logStore.
#  - gwProxy is included. Its main container is the Envoy proxy, so gwProxy.extraVolumeMounts
#    mounts into the Envoy container. The Envoy configuration is generated by the chart and
#    does not read extra files on its own.
#  - logStore renders a pod only in the `dedicatedService` deployment mode.
#
# The chart-defined volumes are named `config` and `tmp-volume` (gwProxy: `config` and, when
# ssl.enabled, `ssl-cert`). The chart does not check for duplicate names. Choosing names that
# do not clash is the responsibility of the user; Kubernetes rejects a pod with duplicate
# volume names.
#
# Example:
#   gateway:
#     extraVolumes:
#       - name: custom-certs
#         secret:
#           secretName: my-certs
#     extraVolumeMounts:
#       - name: custom-certs
#         mountPath: /etc/custom-certs
#         readOnly: true
##########################################################################################

##########################################################################################
# Container arguments, probes and raw pod spec
#
# Optional keys that are read per component. They are unset by default and are shown in the
# example below instead of being declared with a value; when a key is not set, the chart
# renders its built-in behavior unchanged.
#
#   <component>.extraArguments
#       List of strings appended to the container `args`, after the chart-managed args.
#       For example `extraArguments: ["-Xlog:gc"]`.
#   <component>.extraArgumentsMap
#       Map rendered as `-D<key>=<value>` container args, after the chart-managed args and
#       after extraArguments. For example `extraArgumentsMap: {my.property: "value"}`.
#   <component>.disableKubernetesProbes
#       When true, removes the readiness, liveness and startup probes of that workload only.
#       Other workloads keep their probes. Any other value keeps the probes.
#   <component>.spec
#       Raw PodSpec fields, rendered as given into the pod template `spec` of the workload.
#       There is no merge with the fields that the chart renders itself. Do not use it for
#       a field that has a first-class key; use these keys instead:
#         securityContext          -> <component>.podSecurityContext (spec.securityContext is rejected)
#         imagePullSecrets         -> secrets.imagePull
#         initContainers           -> <component>.initContainers
#         volumes, volumeMounts    -> <component>.extraVolumes, <component>.extraVolumeMounts
#       If a field is set both through spec and through the first-class key (for example
#       spec.imagePullSecrets together with secrets.imagePull), the chart renders the field
#       twice in the pod spec. The result is invalid YAML (duplicate key) and Kubernetes
#       tooling rejects it. Set each field in one place only.
#
# Applicable workloads (all four keys): gateway, taskExecutor, operator, mgmtGateway,
# compileBroker, cache and logStore. gwProxy ignores these keys. logStore renders a pod only
# in the `dedicatedService` deployment mode.
#
# Example:
#   compileBroker:
#     extraArguments: ["-Xlog:gc"]
#     extraArgumentsMap:
#       my.property: "value"
#     disableKubernetesProbes: true
#     spec:
#       hostNetwork: true
#
# Related: simpleSizing.disabled is declared in the `simpleSizing` block above.
##########################################################################################
