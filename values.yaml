mgmtGateway:
  resources:
    requests:
      # Do not use non-numerical values such as 200m, otherwise the templating logic will break.
      cpu: "2"
      memory: "2Gi"
      ephemeral-storage: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"
      ephemeral-storage: "1Gi"
  service:
    type: "LoadBalancer"
    httpEndpoint:
      port: 8080
    # Annotations added to the mgmt-gateway Service.
    annotations: {}
  # The MCP server
  mcp:
    enabled: false
  nodeSelector:
    kubernetes.io/arch: amd64
  tolerations: []
  affinity: {}
  applicationLabels: # Additional labels for Deployment/StatefulSet
    #release: "stable"
  applicationAnnotations: # Additional annotations for Deployment/StatefulSet
  podTemplateLabels: # Additional labels for POD
    #environment: "dev"
  podTemplateAnnotations: # Additional annotations for POD
  serviceLabels: # Additional labels for Service
  existingServiceAccount: ""
  # Additional init containers for the POD (standard Kubernetes container spec). Unset by default.
  #initContainers:
  #  - name: dummy-init
  #    image: busybox:1.36
  #    command: ["sh", "-c", "echo init"]
  # Additional environment variables for the container (standard Kubernetes env entries). Unset by default.
  #extraEnv:
  #  - name: MY_VAR
  #    value: "my-value"
  # Additional PodSpec volumes (standard Kubernetes volume spec), appended after the chart-defined ones. Unset by default.
  # Names must not clash with the chart-defined volumes (config, tmp-volume). Avoiding duplicates is the user's responsibility.
  #extraVolumes:
  #  - name: custom-certs
