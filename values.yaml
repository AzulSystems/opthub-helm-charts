---
clusterName: "cluster.local"

autoscaler: true

# The pod-level and container-level securityContext is configurable per component,
# see the end of this file.

# By default, this is points at the docker hub artifacts
registry:
  opthub: "azul"
  # Registry (and optional path) of a Docker Hub mirror used for the default gw-proxy (Envoy)
  # image, e.g. "docker-mirror.example.com". Like registry.opthub, it has no trailing "/"
  # (one is tolerated and ignored). Empty or null means no mirror.
  # Ignored for gw-proxy when gwProxy.image.repository is set.
  dockerhubMirror: ""

imagePullPolicy: "IfNotPresent"

metricsPath:

simpleSizing:
  # Total number of vCores that will be allocated to the CNC service.
  # The sizing formula in the templates will allocate individual
  # CNC infrastructure components to best utilize given resources.
  # The default number is the amount of vCores necessary to start
  # minimum required replicas of each component, so that the service is operational.
  vCores: 39
  # Set to true to turn simple sizing off. `simpleSizing.disabled=true` is then added to
  # opthub.properties. Nothing is rendered when false or unset, so simple sizing is enabled by default.
  disabled: false
  # minVCores and maxVCores has the same formula as vCores, but applied
  # when autoscaling is enabled.
  minVCores: 39
  # Default max is to allocate 10 compile brokers.
  maxVCores: 116


  # Do not change these values unless you change the required CNC pod sizing.
  relationships:
    brokersPerGateway: 4
    brokersPerCache: 100

# Secrets used by helm chart. Secrets are created by helm chart when default config is used.
#
# It is possible to provide name of existing secret. This secret needs to be in same namespace as the namespace
# used by Helm. This secret will then be used instead of creating new one.

secrets:
  # Standard Kubernetes `imagePullSecrets` entries ({name: <secret>}) rendered into the PodSpec
  # of every workload (gateway, gwProxy, operator, taskExecutor, mgmtGateway, compileBroker,
  # cache and logStore). The Secrets must already exist. Unset by default.
  imagePull:
  #  - name: my-registry-secret

  blobStorage:
    s3:
      # name of existing Secret object to use. New Secret is created if name is empty
      existingSecret: ""

      # name of *key* for `accessKey` value in K8S Secret. It can be renamed to match names in existing Secret
      accessKeySecretKey: blob-storage-accesskey
      # default value for accesskey - used when new secret is created
      accesskey: null # <yourAccessKey>

      # name of *key* for `secretkey` value in K8S Secret. It can be renamed to match names in existing Secret
      secretAccessKeySecretKey: blob-storage-secretkey
      # default value for db.secretkey - used when new secret is created
      secretkey: null # <yourSecretKey>
    azure:
      # name of existing Secret object to use. New Secret is created if name is empty
      existingSecret: ""

      # name of *key* for `connectionStringSecretKey` value in K8S Secret. It can be renamed to match names in existing Secret
      connectionStringSecretKey: azure-storage-connection-string
      # connectionString: "<connection-string>" . For authMethod: connection-string,
      # get connection-string on Azure Portal > Storage accounts > {storage_account_name} > Access keys

      # name of *key* for `sasTokenSecretKey` in K8S Secret. It can be renamed to match names in existing Secret
      sasTokenSecretKey: azure-storage-sas-token
      # sasToken: "<sas-token>"  # For authMethod: sas-token,
      # Get sas-token on Azure Portal > Storage accounts > {storage_account_name} > {blob_container} > Shared access tokens

deployment:
  serviceAccount:
    labels: {}
    annotations: {}
    existingServiceAccount: ""

rbac:
  # Create the namespaced Roles and RoleBindings managed by the chart.
  # Set to false when RBAC is managed outside the chart. ServiceAccounts are not affected by
  # this setting; use existingServiceAccount to select or reuse them.
  # When false, grant the ServiceAccount of each component the permissions of the chart's
  # Roles, in the release namespace. The chart templates are the source of truth for the rules;
  # `helm template` with the default value renders them (see the objects of kind Role).
  create: true

logStore:
  enabled: false
  existingServiceAccount: ""

ssl:
  enabled: false
  value:
    cert: ""
    key: ""
  # Chart-relative file paths, read only when ssl.value.* is empty.
  path:
    cert: "cert.pem"
    key: "key.pem"
  # File names under /opt/ssl/ that envoy reads. They are also the keys of the generated Secret,
  # or must match the keys of ssl.existingSecret when it is set.
  file:
    cert: "cert.pem"
    key: "key.pem"
  existingSecret: ""

compilations:
  minVmVersionForCNCCompilation: ""
  concurrencyBoost: ""
  parallelism:
    # Maximum concurrent compilation limit per VM (VMs will not send more than this amount at the same time).
    limitPerVm: 500
    # Maximum amount of parallel compiler engine processes running at the same time per compile broker.
    limitPerCompileBroker: 30
    lookupParallelism: 120 # calculated as limitPerCompileBroker * 4

diagnosticArtifact:
  cleaner:
    enabled: true
    keepFor: "P30D"
    cleanupInterval: "P1D"

compilerEngineUploadTimeout: "PT30S"

readyNowOrchestrator:
  debugInfoHistoryLength: 100
  completedAfter: "PT24H"
  completionGracePeriod: "PT180S"
  cache:
    enabled: true
    maxSizeBytes: 0.5G
  producers:
    continueRecordingOnPromotion: false
    maxConcurrentRecordings: 10
    maxPromotableGeneration: 3
    maxSynchronizedGeneration: 2
    maxProfileSize: 300M
  promotion:
    minProfileSize: 1M
    minProfileDuration: "PT2M"
    minProfileSizePerGeneration: "0:1M,1:10M,2:25M,3:50M"
    minProfileDurationPerGeneration: "0:PT2M,1:PT15M,2:PT30M,3:PT60M"
  cleaner:
    enabled: true
    externalPersistentStorageSoftLimit: "10Gi" # use with s3 or azure-blob storage services
    targetSize: 0 # use only to override auto-settings
    warningSize: 0 # use only to override auto-settings
    keepUnrequestedProfileNamesFor: 0
    keepDebugOnlyGenerationProfilesFor: "P7D"
  indirectDelivery:
    enabled: true
    refresh:
      interval: PT60S
      minRatio: 1.25
      minBytes: 8M
      maxStaleness: PT5M

codeCache:
  cleaner:
    enabled: true
    targetSize: 100Gi
    interval: PT2H
  storage:
    offloadReadOperations: true
    writeBehindStorageMethod: true

inventory:
  enabled: true
  cleaner:
    interval: PT7M

synchronization:
  enabled: true
  # comma separated list of URLs pointing to REST API of other peers,
  # e.g. https://rno.cluster1:8080/,https://rno.cluster2:8080/
  peers: ""
  initialDelay: "PT180s"
  period: "PT30s"

storage:
  blobStorageService:  # Required value. Available options: s3, azure-blob, gcp-blob
  pathPrefix: "%namespace%" # string %namespace% will be replaced by K8S namespace, it can be extended ("%namespace%/test1") or used without namespace ("test2")
  azureBlob:
    endpoint: https://<yourendpoint>.blob.core.windows.net
    authMethod: default-credentials # available options: sas-token, connection-string, default-credentials
    # K8s nodes that run cache, compilebroker and gateway PODs must have RW permissions to storage container below
    container: <your-container>
  gcpBlob:
    commonBucket: <your-bucket>
  s3:
    # K8s nodes that run cache, compilebroker and gateway PODs must have RW permissions to bucket below
    commonBucket: <your-bucket>
    region: "us-west-2"
    storageEndpoint: "" # override to set your s3 endpoint if using S3 compatible storage service
    # Optional. Endpoint embedded in all presigned URLs OptHub creates: profile downloads by the JVM, heap dump
    # uploads and downloads, diagnostic artifact downloads. Set it when the consumers cannot reach storageEndpoint,
    # e.g. storageEndpoint is an in-cluster address (http://s3.cluster.local) and the JVM runs outside the cluster
    # (https://s3.example.com). Must be exactly the address the consumers will call, and must also be reachable from
    # the OptHub pods, which upload heap dumps through a presigned URL. If empty, storageEndpoint is used.
    presignerEndpoint: ""
    # Set to true for S3-compatible storage services that do not support the AWS SDK default behavior
    # (e.g. VAST, Alibaba OSS). Sets quarkus.s3.chunked-encoding=false and quarkus.s3.checksum-validation=false
    # for all components using the S3 client. Applies only when blobStorageService is s3. Leave false for AWS S3.
    compatibilityMode: false

hazelcast:
  watchdog:
    enabled: true
    period: "PT30S"
    timeout: "PT10S"
    threshold: 3

compilationStreaming:
  enabled: false
  eviction:
    enabled: true
    buildRequestRetention: P7D
  # If a JVM with profileName for which a profile is already promoted, connects, and there is no Compilation Stream built
  # yet, OptHub will trigger multiple stream rebuilds. This can happen, e.g., if a new CPU type is used for running the
  # same profile, or even a minor difference, such as a different debug flag used by the client. We don't know when enough
  # compilations are cached for the new client configuration, so we schedule several delayed rebuilds.
  # These options might change in a future release, we plan to implement metric-based rebuilds instead of heuristic-based.
  rebuilds:
    numberOfRuns: 3
    delaySeconds: 600

gateway:
  # Number of gateway replicas. Rendered as `spec.replicas` of the gateway Deployment.
  # When the autoscaler is enabled (gateway.autoscaler.enabled, the default), the operator
  # rescales the Deployment at runtime, so this is only the initial replica count.
  replicas: 1
  autoscaler:
    enabled: true
    # Minimum number of gateway replicas. Rendered as `scaling.gateway.min-replicas`
    # in the generated configuration.
    min: 1
    max:
  resources:
    requests:
      # Do not use non-numerical values such as 200m, otherwise the templating logic will break.
      cpu: "7"
      memory: "28Gi"
      ephemeral-storage: "1Gi"
    limits:
      cpu: "7"
      memory: "28Gi"
      ephemeral-storage: "1Gi"
  nodeSelector:
    kubernetes.io/arch: amd64
  service:
    # Gateway Service type: NodePort, ClusterIP or LoadBalancer.
    # When unset, the effective default depends on the gwProxy mode:
    # LoadBalancer if gwProxy.enabled=true, NodePort if gwProxy.enabled=false.
    # type: NodePort
    httpEndpoint:
      enabled: false
      port: 8080
    grpc:
      port: 50051
    # Annotations added to the gateway Service.
    annotations: {}
  ports:
    # The gateway serves gRPC on its HTTP port (quarkus.grpc.server.use-separate-server=false)
    serviceGrpcPort: 8080
    internalGrpcPort: 50052
  tolerations: []
  affinity: {}
  applicationLabels: # Additional labels for Deployment/StatefulSet
    #release: "stable"
  applicationAnnotations: # Additional annotations for Deployment/StatefulSet
  podTemplateLabels: # Additional labels for POD
  podTemplateAnnotations: # Additional annotations for POD
    #environment: "dev"
  serviceLabels: # Additional labels for Service
  existingServiceAccount: ""
  # Additional init containers for the POD (standard Kubernetes container spec). Unset by default.
  #initContainers:
  #  - name: dummy-init
  #    image: busybox:1.36
  #    command: ["sh", "-c", "echo init"]
  # Additional environment variables for the container (standard Kubernetes env entries). Unset by default.
  #extraEnv:
  #  - name: MY_VAR
  #    value: "my-value"
  # Additional PodSpec volumes (standard Kubernetes volume spec), appended after the chart-defined ones. Unset by default.
  # Names must not clash with the chart-defined volumes (config, tmp-volume). Avoiding duplicates is the user's responsibility.
  #extraVolumes:
  #  - name: custom-certs
  #    secret:
  #      secretName: my-certs
  # Additional volumeMounts for the main container (standard Kubernetes volumeMount spec), appended after the chart-defined ones.
  # Needed to mount extraVolumes into the application container. Unset by default.
  #extraVolumeMounts:
  #  - name: custom-certs
  #    mountPath: /etc/custom-certs
  #    readOnly: true

gwProxy:
  enabled: true
  replicas: 1
  image:
    # Full image path including the registry, without the tag.
    # When set, it is used as is and registry.dockerhubMirror is ignored.
    repository: ""
    # Image tag. When empty, the chart's default Envoy tag (distroless-v1.40-latest) is used. The tag is
    # used as is, so include the "distroless-" prefix when overriding it for the default repository
    # (envoyproxy/envoy). To switch to "non-distroless" use tag like v1.40-latest.
    # Can be combined with the default  repository (including the registry.dockerhubMirror registry)
    # or with a custom repository.
    tag: ""
    pullPolicy: Always
  # Address family used by the Envoy admin endpoint and all listeners. One of:
  #  - dualStack: bind to the IPv6 wildcard "::" with ipv4_compat enabled,
  #    accepting both IPv6 and IPv4 connections. Default.
  #  - ipv4: bind to the IPv4 wildcard "0.0.0.0".
  #    Use on nodes where IPv6 is disabled.
  # Unsupported non-empty values cause Helm rendering to fail.
  bindMode: dualStack
  resources:
    requests:
      cpu: "7"
      memory: "1Gi" # Adjust gwProxy.overloadManager.maxHeapSizeBytes accordingly to the memory budget
      ephemeral-storage: "1Gi"
    limits:
      cpu: "7"
      memory: "1Gi"
      ephemeral-storage: "1Gi"
  overloadManager:
    maxHeapSizeBytes: "524288000" # = "500Mi"
  circuitBreakers:
    maxRequests: "3072"
    maxConnections: "3072"
  ports:
    serviceGrpcPort: 50051
  nodeSelector:
    kubernetes.io/arch: amd64
  tolerations: []
  affinity: {}
  applicationLabels: # Additional labels for Deployment/StatefulSet
    #release: "stable"
  applicationAnnotations: # Additional annotations for Deployment/StatefulSet
  podTemplateLabels: # Additional labels for POD
    #environment: "dev"
  podTemplateAnnotations: # Additional annotations for POD
  serviceLabels: # Additional labels for Service
  existingServiceAccount: ""
  # Additional init containers for the POD (standard Kubernetes container spec). Unset by default.
  #initContainers:
  #  - name: dummy-init
  #    image: busybox:1.36
  #    command: ["sh", "-c", "echo init"]
  # Additional environment variables for the container (standard Kubernetes env entries). Unset by default.
  #extraEnv:
  #  - name: MY_VAR
  #    value: "my-value"
  # Additional PodSpec volumes (standard Kubernetes volume spec), appended after the chart-defined ones. Unset by default.
  # Names must not clash with the chart-defined volumes (config, ssl-cert). Avoiding duplicates is the user's responsibility.
  #extraVolumes:
  #  - name: custom-certs
  #    secret:
  #      secretName: my-certs
  # Additional volumeMounts for the main container (standard Kubernetes volumeMount spec), appended after the chart-defined ones.
  # Needed to mount extraVolumes into the application container. Unset by default.
  #extraVolumeMounts:
  #  - name: custom-certs
  #    mountPath: /etc/custom-certs
  #    readOnly: true

compileBroker:
  enabled: true
  replicas: 1
  autoscaler:
    enabled: true
    min: 1
